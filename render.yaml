# Free deployment. No paid Render database or pre-deploy feature is provisioned.
# Create a Supabase Free project and disable its Data API before setting DATABASE_URL.
services:
  - type: web
    name: e3-hr
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm install -g pnpm@11.19.0 && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Qatar
      # APP_URL uses Render's assigned HTTPS URL by default. Set it for a custom domain.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: supabase
      # Set the Supabase S3 and Resend Free credentials in the service environment.
      # Free Render has no service shell: run admin:bootstrap locally against the database.
